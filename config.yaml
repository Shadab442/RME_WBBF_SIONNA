topology:
  scenario: uma
  num_rings: 1
  num_ut: 300
  ut_height: 1.5                # m

antenna:
  m: 8                          # vertical antenna elements per sector
  antenna_window: rectangular
  downtilt_sweep_deg: [0, 2, 4, 6, 8]

channel:
  carrier_frequency: 3.5e+9     # Hz, n78 FR1 mid-band
  bs_tx_power_dbm: 40.0
  channel_bandwidth_prb: 50
  temperature: 294.0            # K

kpi:
  coverage_threshold_db: 0.0
  sinr_percentiles: [50, 5]

mobility:
  mobility_model: rpgm
  min_ut_speed: 1.0             # m/s
  max_ut_speed: 2.0             # m/s
  num_groups: 60
  deviation_radius_frac_area: 0.05
  member_jitter_speed: 1.0      # m/s

simulation:
  measurement_interval_s: 1.0
  tilt_control_interval_s: 300.0
  num_tilt_control_intervals: 1000
  steady_state_episodes: 50
  num_realizations_per_slot: 1
  environment_seed: 1
  max_realization_cuda: 1

algorithms:
  optimization:
    enabled: true
    coordinate_ascent_max_rounds: 20

  adaptive_legacy:
    overlap_margin_db: 3.0
    edge_percentile: 95.0
    tilt_step_deg: 2.0
    os_threshold: 0.006
    bc_threshold: 0.33
  
  drl:
    policy_name: independent-dqn     # or "random"
    algorithm_seed: 1
    # state_type: top_k_neighbor (default/validated -- own tilt +
    #     top_k_locations by real per-window TRAFFIC IMPORTANCE, each as
    #     [grid-cell identity, coverage fraction] + per-neighbor overshoot
    #     -- see top_k_locations below) |
    #   predicted_top_k_neighbor (same shape, but importance/overshoot are
    #     forecasted from history instead of read from the real just-
    #     elapsed window -- see helpers/spatial_occupancy_estimator.py and
    #     helpers/spatial_radio_state_estimator.py)
    state_type: top_k_neighbor
    # top_k_neighbor's location count -- landed on 10 after empirically
    # checking how many grid cells are actually tilt-sensitive (see
    # scripts/verifications/verify_tilt_sensitivity.py): at a strict
    # >=50%-of-realizations flip-rate bar, under 1 cell/sector on average is
    # genuinely sensitive; 10 is a deliberately generous margin above that.
    top_k_locations: 10
    # Grid cell size [m] for top_k_neighbor(_predicted)'s per-sector rhombus
    # grid -- landed on UMa's shadow-fading decorrelation distance range.
    spatial_grid_cell_size_m: 50.0
    # reward_type: hard (only option -- per-sector coverage/overshoot)
    reward_type: hard
    reward_lambda_coverage: 1.0
    reward_lambda_overshoot: 0.005
    # Decentralized setup -> assume async per-sector updates
    async_schedule: round_robin      # "round_robin" | "random" | "sync"
    async_group_size: 1              # sectors given a new decision per interval

    dqn:
      # model: mlp | wesn -- plain MLP wasn't learning well (flat/noisy
      # reward, see drl/common.py's Mlp); wesn (Windowed Echo State Network,
      # algorithm/wesn.py) gives the Q-network short-term memory across a
      # sector's own recent decisions via a fixed random reservoir + one
      # trained linear readout. Now the default.
      model: wesn
      hidden_sizes: [32]         # mlp only
      # wesn only -- window length, in this sector's OWN past decisions
      # (not raw slots), fed through the reservoir each act()/learn() call.
      # Not yet empirically tuned for this problem.
      sequence_length: 8
      wesn:
        units: 32
        connectivity: 0.5
        spectral_radius: 0.9
        leaky: 1.0
        win_len: 4              # <= sequence_length
      learning_rate: 5.0e-4
      gamma: 0.95
      batch_size: 32
      replay_capacity: 10000
      warmup_steps: 32
      train_steps_per_interval: 1
      target_update_steps: 30
      epsilon_start: 1.0
      epsilon_end: 0.01
      epsilon_decay_rate: 0.995
  
test_tilt_window_calibration:
  candidate_window_slots: [1, 10]
  num_windows_per_candidate: 300
  num_realizations_per_slot: 5
  mobility_speed_settings:
    - name: walk
      min_ut_speed: 1.0
      max_ut_speed: 2.0
    - name: cycle
      min_ut_speed: 5.0
      max_ut_speed: 10.0
    - name: urban_drive
      min_ut_speed: 20.0
      max_ut_speed: 30.0
    - name: highway
      min_ut_speed: 50.0
      max_ut_speed: 80.0     
